<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- corners: fixed, never scaled or repeated -->
  <circle cx="16" cy="16" r="14" fill="#FF9595"/>
  <circle cx="104" cy="16" r="14" fill="#FF9595"/>
  <circle cx="16" cy="104" r="14" fill="#FF9595"/>
  <circle cx="104" cy="104" r="14" fill="#FF9595"/>

  <!-- top edge: one repeatable unit, tiled horizontally -->
  <circle cx="60" cy="18" r="16" fill="#FF9595"/>
  <circle cx="50" cy="5" r="2.5" fill="#FF9595"/>
  <circle cx="70" cy="5" r="2.5" fill="#FF9595"/>

  <!-- bottom edge: one repeatable unit, tiled horizontally -->
  <circle cx="60" cy="102" r="16" fill="#FF9595"/>
  <circle cx="50" cy="115" r="2.5" fill="#FF9595"/>
  <circle cx="70" cy="115" r="2.5" fill="#FF9595"/>

  <!-- left edge: one repeatable unit, tiled vertically -->
  <circle cx="18" cy="60" r="16" fill="#FF9595"/>
  <circle cx="5" cy="50" r="2.5" fill="#FF9595"/>
  <circle cx="5" cy="70" r="2.5" fill="#FF9595"/>

  <!-- right edge: one repeatable unit, tiled vertically -->
  <circle cx="102" cy="60" r="16" fill="#FF9595"/>
  <circle cx="115" cy="50" r="2.5" fill="#FF9595"/>
  <circle cx="115" cy="70" r="2.5" fill="#FF9595"/>
</svg>
